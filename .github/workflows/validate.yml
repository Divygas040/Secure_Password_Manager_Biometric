name: Manual deployment validation
on: workflow_dispatch
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: biopass_ci
          # Disposable CI service only, bound to the runner loopback interface.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s --health-timeout 5s --health-retries 5
    defaults:
      run:
        working-directory: password-manager-backend/password_manager
    env:
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/biopass_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.14"
      - run: sudo apt-get update && sudo apt-get install -y cmake build-essential
      - run: python -m pip install -r requirements.production.lock
      - name: Create ephemeral test secrets without displaying them
        run: |
          python - <<'PY'
          import os, secrets
          from cryptography.fernet import Fernet
          fd = os.open('.env', os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, 'w') as stream:
              stream.write('DJANGO_SECRET_KEY=' + secrets.token_urlsafe(60) + '\n')
              stream.write('VAULT_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
              stream.write('BIOMETRIC_ENCRYPTION_KEY=' + Fernet.generate_key().decode() + '\n')
          PY
      - run: python -m pip check
      - run: python manage.py collectstatic --noinput
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py makemigrations --check
      - run: python manage.py test
      - run: python manage.py check_data_ready
      - name: Production deployment checks
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: api.example.com
          CORS_ALLOWED_ORIGINS: https://example.com
          CSRF_TRUSTED_ORIGINS: https://example.com
          SECURE_HSTS_SECONDS: "3600"
          TRUST_PROXY_HTTPS: "True"
        run: python manage.py check --deploy
      - name: Build Linux deployment image without production secrets
        run: docker build -t biopass-validation ..
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: password-manager-frontend
    env:
      NEXT_PUBLIC_API_URL: https://api.example.com
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: password-manager-frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - run: npm audit --audit-level=low
