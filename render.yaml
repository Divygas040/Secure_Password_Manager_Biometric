# Preparation only. Review service limits manually before creating any resource.
# DATABASE_URL must reference an existing private PostgreSQL service.
# No database or paid plan is created by this blueprint.
services:
  - type: web
    name: password-manager-backend
    runtime: docker
    rootDir: password-manager-backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /health/
    autoDeployTrigger: "off"
    envVars:
      - key: DEBUG
        value: "False"
      - key: TRUST_PROXY_HTTPS
        value: "True"
      - key: COOKIE_SAMESITE
        value: "Lax"
      - key: SECURE_HSTS_SECONDS
        value: "0"
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: VAULT_ENCRYPTION_KEY
        sync: false
      - key: BIOMETRIC_ENCRYPTION_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: EMAIL_BACKEND
        value: anymail.backends.resend.EmailBackend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: BioPass <security@biopassmanager.online>
