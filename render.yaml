databases:
  - name: password_manager_db
    databaseName: password_manager
    user: password_manager_user
    plan: free
    region: singapore

services:
  - type: web
    name: password-manager-backend
    rootDir: password-manager-backend
    runtime: python
    region: singapore
    plan: free
    buildCommand: "./build.sh"
    startCommand: "cd password_manager && gunicorn password_manager.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.9.0
      - key: DATABASE_URL
        fromDatabase:
          name: password_manager_db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
